---
- name: Ensure python3, pip3, and six are installed
  hosts: myvms
  become: yes
  gather_facts: false
  tasks:
    - name: Install python3, pip3, and python3-six,python3-venv
      apt:
        name:
          - python3
          - python3-venv
          - python3-pip
          - python3-six
        state: present
        update_cache: yes 